# Render Blueprint для JustTLD (docker-образ из этого репозитория).
# Postgres берём из Neon (бесплатный тариф) — строка подключения в DATABASE_URL.
#
# Как использовать: Render → New → Blueprint → выбрать репозиторий.
# Все значения с sync: false вводятся в панели Render, в git их нет.
services:
  - type: web
    name: justtld
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # ── сеть ──
      - key: DEPLOYMENT_NETWORK
        value: sepolia
      - key: CHAIN_ID
        value: '11155111'
      - key: RPC_URL
        value: https://ethereum-sepolia-rpc.publicnode.com
      # ── публичные переменные (вшиваются в бандл при сборке) ──
      - key: NEXT_PUBLIC_CHAIN_ID
        value: '11155111'
      - key: NEXT_PUBLIC_CHAIN_NAME
        value: Sepolia Testnet
      - key: NEXT_PUBLIC_ENABLE_DEV_WALLET
        value: 'false'
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      # ── база ──
      - key: DATABASE_URL
        sync: false
      - key: PGSSLMODE
        value: require
      # ── сессии и админ ──
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_ADDRESS
        sync: false
      # ── indexer в том же контейнере (бесплатный тариф) ──
      - key: RUN_INDEXER_IN_WEB
        value: 'true'
      - key: INDEXER_CONFIRMATIONS
        value: '3'
      - key: INDEXER_POLL_INTERVAL_MS
        value: '3000'
      - key: INDEXER_START_BLOCK
        sync: false
      # ── обозреватель ──
      - key: EXPLORER_TX_URL_TEMPLATE
        value: https://sepolia.etherscan.io/tx/{hash}
